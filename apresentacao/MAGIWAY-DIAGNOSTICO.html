<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Magiway — Diagnóstico Comercial</title>
<!--
  ═══════════════════════════════════════════════════════════════════
  MAGIWAY · DIAGNÓSTICO COMERCIAL — documento de apresentação
  ───────────────────────────────────────────────────────────────────
  Arquivo único, sem internet. Nada de CDN: os gráficos são desenhados
  à mão em SVG e canvas. Abre com dois cliques, projeta em qualquer
  tela, funciona sem sinal e não depende do aplicativo.

  PARA ATUALIZAR OS NÚMEROS: só o bloco DADOS logo abaixo. Cada campo
  tem um comentário dizendo de onde ele sai. Nada mais no arquivo
  precisa ser tocado.

  COMO SE USA NA REUNIÃO: qualquer bloco — texto, cartão, tabela ou
  gráfico — vai para o centro da tela em fonte grande com um clique.
  É para projetar e discutir um ponto de cada vez.

  Três regras que este documento segue:
    1. Todo número é rastreável — ou sai do app, ou está marcado como
       declarado. Um dado frouxo derruba o argumento inteiro.
    2. Não há vilão. Os vieses estão nomeados, não julgados. Acusar
       transforma auditoria em queixa, e queixa é descartada.
    3. Elogio sem métrica não entra em ata. Toda afirmação sobre
       capacidade individual está presa a um número, a uma data ou a
       um fato verificável.
  ═══════════════════════════════════════════════════════════════════
-->
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  /* ── paleta Magiway ─────────────────────────────────────────────
     ciano e gelo como cor institucional, vermelho como cor de alerta,
     petróleo e laranja como apoio. Fundo naval, claro o bastante para
     projetar em sala com luz acesa.                                  */
  --ciano:#0CB7F2; --ciano-cl:#7CDAF9; --gelo:#B6FFFF;
  --verm:#ED1128;  --verm-cl:#FF6B79;  --vinho:#7E1A28;
  --laranja:#F2913D; --petro:#1E8C93; --verde:#2BD69C;
  --fundo:#14263A; --fundo2:#1B3049; --marinho:#0E1B2B;
  --painel:rgba(255,255,255,.055); --painel2:rgba(255,255,255,.10);
  --txt:#F4FAFF; --txt2:#D6E7F4; --txt3:#9FB8CC;
  --borda:rgba(180,225,250,.20);
}
html{scroll-behavior:smooth}
body{background:var(--fundo);color:var(--txt);
  font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',sans-serif;
  font-size:17.5px;line-height:1.75;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(1100px 640px at 50% -10%,rgba(12,183,242,.16),transparent 62%),
             radial-gradient(760px 520px at 4% 42%,rgba(30,140,147,.13),transparent 62%),
             radial-gradient(760px 520px at 96% 42%,rgba(237,17,40,.10),transparent 62%)}
.wrap{max-width:1220px;margin:0 auto;padding:0 30px;position:relative;z-index:1}

/* barra de progresso da leitura */
#prog{position:fixed;left:0;top:0;height:3px;width:0;z-index:60;
  background:linear-gradient(90deg,var(--petro),var(--ciano),var(--gelo));transition:width .1s linear}

/* navegação lateral */
nav{position:fixed;right:24px;top:50%;transform:translateY(-50%);z-index:50;display:flex;
  flex-direction:column;gap:10px}
nav a{width:9px;height:9px;background:rgba(182,255,255,.26);display:block;position:relative;
  transition:background .2s,transform .2s}
nav a:hover,nav a.on{background:var(--ciano);transform:scale(1.55)}
nav a span{position:absolute;right:20px;top:50%;transform:translateY(-50%);white-space:nowrap;
  font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--txt2);
  background:rgba(14,27,43,.96);padding:5px 10px;opacity:0;pointer-events:none;transition:opacity .2s;
  border-left:2px solid var(--ciano)}
nav a:hover span{opacity:1}
@media(max-width:1120px){nav{display:none}}

/* seções — cabeçalho centrado, corpo em coluna centrada: simetria */
section{padding:82px 0;border-top:1px solid var(--borda)}
section:first-of-type{border-top:none}
.cab{max-width:80ch;margin:0 auto 34px;text-align:center}
.num{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;letter-spacing:.3em;
  color:var(--ciano);display:block;margin-bottom:14px;font-weight:700}
h2{font-size:clamp(27px,3.7vw,42px);line-height:1.14;letter-spacing:-.02em;font-weight:800;
  margin-bottom:14px;color:#fff}
h2 em{font-style:normal;color:var(--ciano-cl)}
.sub{font-size:16.5px;color:var(--txt3);line-height:1.7;margin:0 auto}
h3{font-size:23px;color:#fff;font-weight:750;line-height:1.28;margin:40px 0 10px;text-align:center}
p{font-size:18px;line-height:1.88;color:var(--txt2);margin:0 auto 18px;max-width:88ch}
p b,li b,td b{color:#fff;font-weight:650}
p em{font-style:normal;color:var(--gelo)}
.rv{opacity:0;transform:translateY(20px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.8,.2,1)}
.rv.on{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}}

/* capa — coluna única centrada */
#capa{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:70px 0;border:none;gap:6px}
.eyebrow{font-size:12px;letter-spacing:.34em;color:var(--verm-cl);font-weight:700;margin-bottom:20px}
h1{font-size:clamp(30px,4.3vw,52px);line-height:1.12;letter-spacing:-.03em;font-weight:800;color:#fff;
  max-width:28ch}
h1 em{font-style:normal;color:var(--ciano-cl)}
.esf{position:relative;aspect-ratio:1;width:min(340px,62vw);margin:18px auto 2px}
.esf canvas{width:100%;height:100%;display:block}
.esf-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;pointer-events:none}
.esf-c::before{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:82%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,rgba(20,38,58,.94) 44%,rgba(20,38,58,0) 76%)}
.esf-n{position:relative;font-family:ui-monospace,Menlo,monospace;font-size:clamp(56px,9vw,94px);
  font-weight:800;line-height:1;color:var(--verm-cl)}
.esf-n sup{font-size:.42em;vertical-align:super;font-weight:700}
.esf-l{position:relative;font-size:11px;letter-spacing:.3em;color:var(--gelo);font-weight:700;margin-top:12px}
.esf-s{position:relative;font-size:13.5px;color:var(--txt2);margin-top:8px;max-width:26ch}
.lead{font-size:18px;line-height:1.72;color:var(--txt2);margin:18px auto 0;max-width:68ch}
.assina{margin-top:22px;font-size:13px;color:var(--txt3);letter-spacing:.06em}
.dica{margin-top:18px;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ciano);
  border:1px solid var(--borda);padding:8px 16px;display:inline-block}

/* números */
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:30px 0}
.n{padding:24px;background:var(--painel);border:1px solid var(--borda);border-top:3px solid var(--ciano);
  text-align:center;display:flex;flex-direction:column;justify-content:flex-start}
.n.ok{border-top-color:var(--verde)}
.n.mau{border-top-color:var(--verm);background:rgba(237,17,40,.10)}
.n-v{font-family:ui-monospace,Menlo,monospace;font-size:40px;font-weight:800;line-height:1;color:#fff}
.n.ok .n-v{color:var(--verde)} .n.mau .n-v{color:var(--verm-cl)}
.n-t{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--txt3);margin-top:12px;font-weight:700}
.n-s{font-size:13.5px;color:var(--txt3);margin-top:8px;line-height:1.6}

/* frases de impacto */
.golpe{margin:30px auto;padding:28px 32px;border-left:5px solid var(--verm);max-width:96ch;
  background:linear-gradient(90deg,rgba(237,17,40,.16),rgba(237,17,40,.03));
  font-size:21.5px;line-height:1.55;font-weight:700;color:#fff}
.golpe.v{border-left-color:var(--verde);background:linear-gradient(90deg,rgba(43,214,156,.15),rgba(43,214,156,.02))}
.golpe.o{border-left-color:var(--laranja);background:linear-gradient(90deg,rgba(242,145,61,.15),rgba(242,145,61,.02))}
.golpe.c{border-left-color:var(--ciano);background:linear-gradient(90deg,rgba(12,183,242,.16),rgba(12,183,242,.02))}
.golpe small{display:block;font-size:16.5px;font-weight:400;color:var(--txt2);margin-top:13px;line-height:1.8}

/* cartões de erro */
.erros{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.erro{padding:28px 30px;background:rgba(237,17,40,.09);border:1px solid rgba(255,107,121,.28);
  border-left:4px solid var(--verm);position:relative}
.erro-n{position:absolute;right:22px;top:18px;font-family:ui-monospace,Menlo,monospace;font-size:46px;
  font-weight:800;color:rgba(255,107,121,.20);line-height:1}
.erro h3{font-size:19.5px;color:var(--verm-cl);margin:0 0 14px;padding-right:56px;line-height:1.32;
  font-weight:750;text-align:left}
.rot{font-size:11px;letter-spacing:.17em;text-transform:uppercase;color:var(--txt3);
  margin:17px 0 5px;font-weight:700}
.erro p{font-size:16.5px;line-height:1.8;margin:0;max-width:none}
.prova{font-family:ui-monospace,Menlo,monospace;font-size:15px;color:var(--laranja)}
.fazer{color:#9BEFD2}

/* verbetes */
details{background:var(--painel);border:1px solid var(--borda);border-left:3px solid rgba(182,255,255,.25);
  margin-bottom:10px}
details[open]{border-left-color:var(--ciano)}
summary{cursor:pointer;padding:18px 22px;font-size:17px;color:var(--txt);list-style:none;
  display:flex;gap:14px;align-items:baseline;transition:background .15s}
summary::-webkit-details-marker{display:none}
summary:hover{background:var(--painel2)}
details[open] summary{color:var(--ciano-cl);font-weight:650}
.tag{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--txt3);flex-shrink:0;min-width:78px}

/* tabelas */
.tb{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:16px;margin-top:18px;background:var(--painel)}
th{text-align:left;padding:15px;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--gelo);background:rgba(12,183,242,.14);font-weight:700}
td{padding:15px;border-bottom:1px solid var(--borda);color:var(--txt2);vertical-align:top;line-height:1.62}
td:first-child{color:#fff;font-weight:650}
.dir{color:var(--verm-cl);font-family:ui-monospace,Menlo,monospace;font-size:14px}
.ven{color:#9BEFD2;font-family:ui-monospace,Menlo,monospace;font-size:14px}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:14.5px;color:var(--gelo)}
.barrinha{height:9px;background:rgba(255,255,255,.10);min-width:80px;display:block}
.barrinha i{display:block;height:100%;background:linear-gradient(90deg,var(--petro),var(--verm))}

/* gráficos svg */
.grafs{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:24px}
.graf{background:var(--painel);border:1px solid var(--borda);padding:26px 28px;display:flex;flex-direction:column}
.graf h4{font-size:16px;color:#fff;font-weight:750;margin-bottom:5px;letter-spacing:.02em}
.graf .gs{font-size:13.5px;color:var(--txt3);margin-bottom:20px;line-height:1.55}
.graf svg{width:100%;height:auto;display:block;overflow:visible}
.graf p{font-size:15px;margin:14px 0 0;max-width:none}
.lg{display:flex;gap:18px;flex-wrap:wrap;margin-top:16px;font-size:13px;color:var(--txt2);justify-content:center}
.lg i{display:inline-block;width:12px;height:12px;margin-right:6px;vertical-align:-1px}

/* blocos diversos */
.assum{display:flex;gap:20px;padding:22px 24px;margin-bottom:10px;background:rgba(237,17,40,.09);
  border:1px solid rgba(255,107,121,.24);border-left:3px solid var(--verm)}
.assum-n{font-family:ui-monospace,Menlo,monospace;font-size:22px;font-weight:800;
  color:rgba(255,107,121,.55);min-width:32px;line-height:1.35}
.assum h4{font-size:17.5px;color:var(--verm-cl);margin-bottom:8px;line-height:1.32}
.assum p{font-size:16.5px;margin:0;max-width:none}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:24px 0}
.tri>div{padding:24px;background:var(--painel);border:1px solid var(--borda);border-top:3px solid var(--ciano)}
.tri h4{font-size:16.5px;color:var(--ciano-cl);margin-bottom:11px}
.tri p{font-size:16px;margin:0;max-width:none}
.duo{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin:24px 0}
.duo>div{padding:26px 28px;background:var(--painel);border:1px solid var(--borda)}
.duo h4{font-size:17px;margin-bottom:11px;color:#fff}
.duo p{font-size:16.5px;margin:0 0 12px;max-width:none}
.duo p:last-child{margin-bottom:0}
.duo.neg>div:first-child{border-top:3px solid var(--verm)}
.duo.neg>div:last-child{border-top:3px solid var(--verde)}
.decl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--laranja);
  border:1px solid rgba(242,145,61,.5);padding:2px 8px;margin-left:7px;white-space:nowrap}
.perg{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:24px}
.perg>div{padding:32px 28px;background:var(--painel2);border:1px solid var(--borda);text-align:center}
.perg .q{font-size:21px;color:#fff;font-weight:750;margin-bottom:15px;line-height:1.3}
.perg .a{font-size:16px;color:var(--txt2);line-height:1.78}
.linha{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:24px 0}
.linha>div{background:var(--painel);border:1px solid var(--borda);border-left:3px solid var(--petro);padding:22px 24px}
.linha h4{font-size:15px;color:var(--gelo);letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px}
.linha p{font-size:16px;margin:0;max-width:none}
ul,ol{margin:0 auto 18px;max-width:88ch;padding-left:24px}
li{font-size:17.5px;line-height:1.85;color:var(--txt2);margin-bottom:10px}
.centro{text-align:center}

/* ── LUPA: qualquer bloco vai ao centro da tela em fonte grande ── */
.zoom{cursor:zoom-in}
#lupa{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;
  background:rgba(9,20,33,.90);padding:34px}
#lupa.on{display:flex}
#lupa-box{position:relative;background:var(--fundo2);border:1px solid var(--borda);
  max-width:1080px;width:100%;max-height:88vh;overflow:auto;padding:52px 56px;
  box-shadow:0 34px 100px rgba(0,0,0,.6);cursor:auto}
#lupa-box>*{max-width:100%}
#lupa-box .rv{opacity:1;transform:none}
#lupa-box p,#lupa-box li,#lupa-box td,#lupa-box .a,#lupa-box .n-s{font-size:23px;line-height:1.82;max-width:none}
#lupa-box h2{font-size:38px} #lupa-box h3,#lupa-box h4,#lupa-box .q{font-size:28px;line-height:1.3}
#lupa-box .golpe{font-size:29px;max-width:none;margin:0}
#lupa-box .golpe small{font-size:21px}
#lupa-box .n-v{font-size:64px} #lupa-box .n-t{font-size:15px} #lupa-box .esf-n{font-size:84px}
#lupa-box .prova,#lupa-box .mono,#lupa-box .dir,#lupa-box .ven{font-size:20px}
#lupa-box .gs,#lupa-box .sub{font-size:19px} #lupa-box .rot{font-size:14px}
#lupa-box th{font-size:14px} #lupa-box .lg{font-size:18px}
#lupa-box .erro-n,#lupa-box .assum-n{font-size:52px}
#lupa-box .graf,#lupa-box .erro,#lupa-box .n,#lupa-box .assum{background:none;border:none;padding:0}
#lupa-box .decl{font-size:14px}
#lupa-x{position:fixed;right:38px;top:26px;z-index:101;background:var(--painel2);color:#fff;
  border:1px solid var(--borda);font-size:15px;letter-spacing:.16em;padding:11px 20px;cursor:pointer;
  font-family:inherit;text-transform:uppercase;display:none}
#lupa.on ~ #lupa-x{display:block}
@media(max-width:640px){#lupa{padding:12px}#lupa-box{padding:26px 22px}
  #lupa-box p,#lupa-box li,#lupa-box td{font-size:19px}#lupa-box .golpe{font-size:22px}}

footer{padding:64px 0 88px;border-top:1px solid var(--borda);color:var(--txt3);font-size:14px;text-align:center}
@media print{
  nav,#prog,#lupa,#lupa-x,.dica{display:none!important} body{background:#fff;color:#000}
  section{page-break-inside:avoid;border-color:#ccc} .rv{opacity:1;transform:none}
}
@media(max-width:980px){
  .nums{grid-template-columns:repeat(2,1fr)} .erros,.grafs,.tri,.perg,.duo,.linha{grid-template-columns:1fr}
}
@media(max-width:640px){
  body{font-size:16px} .wrap{padding:0 16px} section{padding:52px 0}
  .nums{grid-template-columns:1fr} .n-v{font-size:34px} .golpe{font-size:18.5px;padding:22px 24px}
  p{font-size:17px}
}
</style>
</head>
<body>
<div id="prog"></div>
<nav id="nav"></nav>
<div class="wrap" id="doc"></div>
<div id="lupa"><div id="lupa-box"></div></div>
<button id="lupa-x" type="button">Fechar ✕</button>

<script>
/* ═══════════════════════════════════════════════════════════════════
   DADOS — é só aqui que se mexe para atualizar o documento
   ═══════════════════════════════════════════════════════════════════ */
var D = {
  /* ── do aplicativo (Dash de Cotações / Reservas / Frota) ── */
  excMedio      : 52.9,   // % médio acima da faixa do nicho B/C
  indice        : 46,     // índice de contracorrente do app (0 a 100)

  /* A base de tudo o que fala de perfil de cliente é a COTAÇÃO, não a
     venda — é assim que o cpClassificar do aplicativo trabalha. Quatro
     critérios, todos obrigatórios: mais de 10 diárias, Orlando→Orlando,
     minivan (7L ou 8L) e retirada em até 3 meses. Quem falha em um já
     é complexo. Por isso o percentual de ideal é baixo: ele mede o que
     ENTRA, não o que fecha. As conversões por perfil abaixo saem destas
     quatro contagens, e não de números soltos — assim o documento não
     pode apresentar taxas que não fecham com o total. */
  cotacoes      : 60,     // cotações do período · Dash de Cotações
  vendas        : 11,     // reservas fechadas no período · aba Reservas
  pctIdeal      : 5.1,    // % das cotações que cumprem os quatro critérios
  vendasIdeal   : 1,      // fechamentos vindos de cotação de perfil ideal
                          //   (os outros 10 são de perfil complexo)
  frotaTotal    : 22,     // carros na frota
  frotaMinivan  : 16,     // quantos são minivan (7L + 8L)
  diasMeta      : 11,     // dias até bater o Diamante
  diasCiclo     : 31,     // dias do ciclo
  cvVendas      : 48,     // coeficiente de variação das vendas por dia (%)

  /* ── preços: MAGIWAY_Analise_Precos_NEON, agosto/2026, nicho B/C sem GS ── */
  precos: [
    {nome:'Minivan',     mag:1864, nicho:1251, topo:1500, sug:1549},
    {nome:'SUV',         mag:1642, nicho: 995, topo:1200, sug:1290},
    {nome:'SUV Premium', mag:4527, nicho:null, topo:null, sug:2690}
  ],

  /* ── declarados: não saem de nenhuma tela ── */
  papeis    : 8,    // frentes que a mesma pessoa toca
  tempoVenda: 35,   // % do tempo efetivamente vendendo
  sublocado : 40,   // % da frota que é sublocada
  qi        : 141,
  mesesOper : 6     // permanência proposta no operacional
};

/* ═══════════════════════════════════════════════════════════════════
   FERRAMENTAS DE DESENHO
   Gráfico aqui é SVG escrito à mão. Sem biblioteca: o documento precisa
   abrir sem internet, num notebook emprestado, cinco minutos antes da
   reunião. Biblioteca por CDN quebra exatamente nessa hora.
   ═══════════════════════════════════════════════════════════════════ */
var n0=function(v){ return Math.round(+v||0).toLocaleString('pt-BR'); };
var n1=function(v){ return (+v||0).toFixed(1).replace('.',','); };
var esc=function(v){ return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;'); };

/* barras agrupadas, horizontais — legíveis em projeção */
function barras(series, rotulos, cores, sufixo, largura, casas){
  var fmt=(casas===1)?n1:n0;
  var L=largura||560, alt=rotulos.length*(series.length*22+22)+14, x0=146;
  var max=0; series.forEach(function(s){ s.dados.forEach(function(v){ if(v>max) max=v; }); });
  max=max||1;
  var o='<svg viewBox="0 0 '+L+' '+alt+'" role="img">';
  for(var g=0;g<=4;g++){

/* curva de duas linhas — ritmo até a meta */
function curva(real, alvo, L, H){
  L=L||560; H=H||230;
  var max=Math.max.apply(null,real.concat(alvo))||1, n=real.length;
  var px=function(i){ return 34+(L-50)*(n>1?i/(n-1):0); };
  var py=function(v){ return H-26-(H-46)*(v/max); };
  var cam=function(arr){ return arr.map(function(v,i){ return (i?'L':'M')+px(i).toFixed(1)+' '+py(v).toFixed(1); }).join(' '); };
  var o='<svg viewBox="0 0 '+L+' '+H+'" role="img">';
  for(var g=0;g<=3;g++){ var gy=H-26-(H-46)*g/3;
    o+='<line x1="30" y1="'+gy+'" x2="'+(L-14)+'" y2="'+gy+'" stroke="rgba(182,225,250,.12)"/>'; }
  o+='<path d="'+cam(alvo)+'" fill="none" stroke="rgba(214,231,244,.42)" stroke-width="1.6" stroke-dasharray="6 5"/>';
  o+='<path d="'+cam(real)+' L'+px(n-1).toFixed(1)+' '+(H-26)+' L34 '+(H-26)+' Z" fill="rgba(12,183,242,.16)"/>';
  o+='<path d="'+cam(real)+'" fill="none" stroke="#0CB7F2" stroke-width="2.9">'
    +'<animate attributeName="stroke-dasharray" from="0 3000" to="3000 0" dur="1.5s" fill="freeze"/></path>';
  return o+'</svg>';
}
/* radar de competências — polígono regular, simétrico por construção */
function radar(itens){
  var L=560,H=470,cx=280,cy=228,R=150,n=itens.length;
  var pt=function(i,f){ var a=-Math.PI/2+2*Math.PI*i/n;
    return [cx+Math.cos(a)*R*f, cy+Math.sin(a)*R*f]; };
  var poli=function(f,fill,stroke,sw){
    var d=itens.map(function(_,i){ var p=pt(i,f); return (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1); }).join(' ')+' Z';
    return '<path d="'+d+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'"/>';
  };
  var o='<svg viewBox="0 0 '+L+' '+H+'" role="img">';
  [1,.75,.5,.25].forEach(function(f){ o+=poli(f,'none','rgba(182,225,250,.14)',1); });
  itens.forEach(function(_,i){ var p=pt(i,1);
    o+='<line x1="'+cx+'" y1="'+cy+'" x2="'+p[0].toFixed(1)+'" y2="'+p[1].toFixed(1)+'" stroke="rgba(182,225,250,.14)"/>'; });
  var d=itens.map(function(it,i){ var p=pt(i,it.v/100); return (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1); }).join(' ')+' Z';
  o+='<path d="'+d+'" fill="rgba(12,183,242,.26)" stroke="#0CB7F2" stroke-width="2.4">'
    +'<animate attributeName="opacity" from="0" to="1" dur="1s" fill="freeze"/></path>';
  itens.forEach(function(it,i){
    var p=pt(i,it.v/100);
    o+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="4" fill="#B6FFFF"/>';
    var q=pt(i,1.19), a=-Math.PI/2+2*Math.PI*i/n, cos=Math.cos(a);
    var anc=cos>0.25?'start':(cos<-0.25?'end':'middle');
    o+='<text x="'+q[0].toFixed(1)+'" y="'+(q[1]+4).toFixed(1)+'" text-anchor="'+anc+'" fill="#D6E7F4" '
      +'font-size="12.5" font-family="inherit">'+esc(it.n)+'</text>';
    o+='<text x="'+q[0].toFixed(1)+'" y="'+(q[1]+20).toFixed(1)+'" text-anchor="'+anc+'" fill="#7CDAF9" '
      +'font-size="12" font-family="ui-monospace,Menlo,monospace">'+it.v+'</text>';
  });
  return o+'</svg>';
}

<script>
/* ═══════════════════════════════════════════════════════════════════
   A ESFERA — a mesma linguagem visual do aplicativo
   Pontos distribuídos por espiral de Fibonacci, respiração radial,
   impulsos em ciano atravessando a malha vermelha e giro lento. O
   número no meio é o índice de dificuldade de vender, decomposto
   fator a fator no § 2.
   ═══════════════════════════════════════════════════════════════════ */
function esferaIniciar(cv, nivel){
  var P=[], N=150, ang=0;
  var ph=Math.PI*(3-Math.sqrt(5));
  for(var i=0;i<N;i++){
    var y=1-(i/(N-1))*2, r=Math.sqrt(Math.max(0,1-y*y)), t=ph*i;
    P.push({ lat:Math.asin(y), lon:t, fase:Math.random()*6.2832,
      vel:.011+Math.random()*.016, amp:.10+Math.random()*.13, carga:0, rad:1,
      x:r*Math.cos(t), y:y, z:r*Math.sin(t) });
  }
  var viz=null, quadro=0;
  var vizinhos=function(){
    viz=P.map(function(){ return []; });
    for(var a=0;a<P.length;a++) for(var b=a+1;b<P.length;b++){
      var dx=P[a].x-P[b].x, dy=P[a].y-P[b].y, dz=P[a].z-P[b].z;
      if(dx*dx+dy*dy+dz*dz<0.25){ viz[a].push(b); viz[b].push(a); }
    }
    quadro=0;
  };
  vizinhos();
  var ctx=cv.getContext('2d'), ultimo=0;
  var mover=function(){
    if(++quadro>90) vizinhos();
    if(Math.random()<0.03+0.05*(nivel/100)) P[(Math.random()*P.length)|0].carga=1;
    var novo=P.map(function(p,i){
      var c=p.carga*0.90;
      viz[i].forEach(function(k){ var q=P[k].carga*0.11; if(q>c) c=q; });
      return c<0.004?0:c;
    });
    P.forEach(function(p,i){
      p.carga=novo[i]; p.fase+=p.vel;
      p.rad=1+p.amp*Math.sin(p.fase)+0.26*p.carga;
      var cl=Math.cos(p.lat);
      p.x=cl*Math.cos(p.lon); p.y=Math.sin(p.lat); p.z=cl*Math.sin(p.lon);
    });
  };
  var desenhar=function(){
    var dpr=Math.min(2,window.devicePixelRatio||1);
    var L=cv.clientWidth||360, H=cv.clientHeight||360;
    if(cv.width!==L*dpr){ cv.width=L*dpr; cv.height=H*dpr; }
    ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,L,H);
    var cx=L/2, cy=H/2, R=Math.min(L,H)*0.37, FOC=2.6;
    var ci=Math.cos(-0.30), si=Math.sin(-0.30), ca=Math.cos(ang), sa=Math.sin(ang);
    var pr=P.map(function(p){
      var px=p.x*p.rad, py=p.y*p.rad, pz=p.z*p.rad;
      var x=px*ca-pz*sa, z0=px*sa+pz*ca;
      var y=py*ci-z0*si, z=py*si+z0*ci, e=FOC/(FOC-z);
      return {sx:cx+x*R*e, sy:cy+y*R*e, z:z, c:p.carga};
    });
    for(var a=0;a<P.length;a++) for(var b=a+1;b<P.length;b++){
      var dx=P[a].x-P[b].x, dy=P[a].y-P[b].y, dz=P[a].z-P[b].z;
      var d=Math.sqrt(dx*dx+dy*dy+dz*dz);
      if(d>0.46) continue;
      var A=pr[a], B=pr[b], f=((A.z+B.z)/2+1)/2;
      var op=(0.10+0.42*f)*(1-d/0.46), c=Math.max(P[a].carga,P[b].carga);
      if(c>0.03){ ctx.lineWidth=1+2.4*c; ctx.strokeStyle='rgba(124,218,249,'+Math.min(1,.36+.64*c).toFixed(3)+')'; }
      else{ ctx.lineWidth=.85; ctx.strokeStyle='rgba(237,17,40,'+(op*1.25).toFixed(3)+')'; }
      ctx.beginPath(); ctx.moveTo(A.sx,A.sy); ctx.lineTo(B.sx,B.sy); ctx.stroke();
    }
    pr.slice().sort(function(x,y){ return x.z-y.z; }).forEach(function(Q){
      var f=(Q.z+1)/2, r=(1+2.2*f)*(1+1.3*Q.c);
      ctx.beginPath(); ctx.arc(Q.sx,Q.sy,r,0,6.2832);
      ctx.fillStyle=Q.c>0.03?'rgba(182,255,255,'+Math.min(1,.55+.45*Q.c).toFixed(3)+')'
        :'rgba(255,'+Math.round(60+95*f)+','+Math.round(75+70*f)+','+(0.38+0.58*f).toFixed(3)+')';
      ctx.shadowColor=Q.c>0.03?'#7CDAF9':'#ED1128'; ctx.shadowBlur=Q.c>0.03?14:(f>.86?12:0);
      ctx.fill(); ctx.shadowBlur=0;
    });
  };
  (function laco(t){
    requestAnimationFrame(laco);
    if(t-ultimo<16) return;
    ultimo=t; ang+=0.0011; mover(); desenhar();
  })(0);
}
</script>

];

+'<div class="golpe v">Luciano não é a régua. É a exceção — e exceção não se usa como linha de base.'

/* esfera + contador do índice */
(function(){
  var el=document.getElementById('esf-n');
  var cv=document.getElementById('esf');
  if(cv) esferaIniciar(cv, NIVEL);
  var t0=performance.now();
  (function tick(now){
    var q=Math.min(1,(now-t0)/1600), e=1-Math.pow(1-q,3);
    if(el) el.innerHTML=Math.round(NIVEL*e)+'<sup>%</sup>';
    if(q<1) requestAnimationFrame(tick);
  })(t0);
})();

/* ═══════════════════════════════════════════════════════════════════
   A LUPA — clicar em qualquer bloco leva ao centro da tela em fonte
   grande. Serve para projetar: discute-se um ponto de cada vez, sem
   ninguém precisar apertar os olhos do fundo da sala.
   ═══════════════════════════════════════════════════════════════════ */
(function(){
  var CART='.graf,.erro,.assum,.perg>div,.tri>div,.duo>div,.linha>div,.golpe,.n,table,details';
  var TXT ='p,li,h2,h3,h4,.sub,.lead,.q,.a';
  var lupa=document.getElementById('lupa'), box=document.getElementById('lupa-box');
  var x=document.getElementById('lupa-x');
  var marcar=function(){
    [].slice.call(document.querySelectorAll(CART+','+TXT)).forEach(function(el){
      if(!el.closest('#lupa')) el.classList.add('zoom');
    });
  };
  marcar();
  var abrir=function(el){
    box.innerHTML='';
    var c=el.cloneNode(true);
    c.classList.remove('zoom');
    [].slice.call(c.querySelectorAll('.zoom')).forEach(function(z){ z.classList.remove('zoom'); });
    /* SMIL clonado depois que a linha do tempo já correu volta ao valor
       inicial em vez de congelar no final: sem isto a barra some ao ampliar.
       Removendo a animação, o SVG fica no valor estático, que já é o final. */
    [].slice.call(c.querySelectorAll('animate')).forEach(function(a){ a.parentNode.removeChild(a); });
    box.appendChild(c);
    box.scrollTop=0;
    lupa.classList.add('on');
    document.body.style.overflow='hidden';
  };
  var fechar=function(){
    lupa.classList.remove('on'); box.innerHTML=''; document.body.style.overflow='';
  };
  document.addEventListener('click', function(ev){
    if(lupa.classList.contains('on')){
      if(ev.target===lupa){ fechar(); }
      return;
    }
    var t=ev.target;
    if(!t || !t.closest) return;
    if(t.closest('#nav') || t.closest('summary') || t.closest('a') || t.closest('#lupa-x')) return;
    var alvo=t.closest(CART) || t.closest(TXT);
    if(!alvo) return;
    ev.preventDefault();
    abrir(alvo);
  });
  x.addEventListener('click', fechar);
  document.addEventListener('keydown', function(ev){
    if(ev.key==='Escape') fechar();
  });
})();

/* revelar ao rolar + barra de progresso + item de navegação ativo */
(function(){
  var blocos=[].slice.call(document.querySelectorAll('.rv'));
  if('IntersectionObserver' in window){
    var io=new IntersectionObserver(function(is){
      is.forEach(function(i){ if(i.isIntersecting){ i.target.classList.add('on'); io.unobserve(i.target); } });
    },{threshold:.10});
    blocos.forEach(function(b){ io.observe(b); });
  } else blocos.forEach(function(b){ b.classList.add('on'); });

  var prog=document.getElementById('prog');
  var links=[].slice.call(document.querySelectorAll('#nav a'));
  var secs=S.map(function(x){ return document.getElementById(x.id); });
  var aoRolar=function(){
    var h=document.documentElement;
    var p=h.scrollTop/((h.scrollHeight-h.clientHeight)||1);
    prog.style.width=(p*100).toFixed(1)+'%';
    var meio=h.scrollTop+h.clientHeight*0.35, atual=0;
    secs.forEach(function(sc,i){ if(sc && sc.offsetTop<=meio) atual=i; });
    links.forEach(function(a,i){ a.classList.toggle('on', i===atual); });
  };
  window.addEventListener('scroll',aoRolar,{passive:true});
  window.addEventListener('resize',aoRolar);
  aoRolar();
})();
</script>
