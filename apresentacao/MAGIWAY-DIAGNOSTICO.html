<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Magiway — Diagnóstico Comercial</title>
<!--
  ═══════════════════════════════════════════════════════════════════
  MAGIWAY · DIAGNÓSTICO COMERCIAL — documento de apresentação
  ───────────────────────────────────────────────────────────────────
  Arquivo único, sem internet. Nada de CDN: os gráficos são desenhados
  à mão em SVG e canvas. Abre com dois cliques, projeta em qualquer
  tela, funciona sem sinal e não depende do aplicativo.

  PARA ATUALIZAR OS NÚMEROS: só o bloco DADOS logo abaixo. Cada campo
  tem um comentário dizendo de onde ele sai. Nada mais no arquivo
  precisa ser tocado.

  Duas regras que este documento segue:
    1. Todo número é rastreável — ou sai do app, ou está marcado como
       declarado. Um dado frouxo derruba o argumento inteiro.
    2. Não há vilão. Os vieses estão nomeados, não julgados. Acusar
       transforma auditoria em queixa, e queixa é descartada.
  ═══════════════════════════════════════════════════════════════════
-->
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --rosa:#FF3D8B; --ouro:#FFC861; --verm:#FF4D4D; --verde:#2BE8A5;
  --azul:#5AB8FF; --petro:#2BC4C0;
  --fundo:#080D16; --sup:rgba(255,255,255,.065); --sup2:rgba(255,255,255,.095);
  --txt:#EAF2FA; --txt2:#C3D5E6; --txt3:#8FA6BC;
  --borda:rgba(255,255,255,.11);
}
html{scroll-behavior:smooth}
body{background:var(--fundo);color:var(--txt);
  font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',sans-serif;
  font-size:17px;line-height:1.7;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(1200px 700px at 12% -8%,rgba(255,61,139,.10),transparent 60%),
             radial-gradient(900px 600px at 105% 18%,rgba(43,196,192,.08),transparent 60%)}
.wrap{max-width:1180px;margin:0 auto;padding:0 26px;position:relative;z-index:1}

/* barra de progresso da leitura */
#prog{position:fixed;left:0;top:0;height:3px;width:0;z-index:60;
  background:linear-gradient(90deg,var(--petro),var(--rosa),var(--ouro));transition:width .1s linear}

/* navegação */
nav{position:fixed;right:22px;top:50%;transform:translateY(-50%);z-index:50;display:flex;
  flex-direction:column;gap:9px}
nav a{width:9px;height:9px;background:rgba(255,255,255,.22);display:block;position:relative;
  transition:background .2s,transform .2s}
nav a:hover,nav a.on{background:var(--rosa);transform:scale(1.5)}
nav a span{position:absolute;right:20px;top:50%;transform:translateY(-50%);white-space:nowrap;
  font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--txt2);
  background:rgba(8,13,22,.95);padding:4px 9px;opacity:0;pointer-events:none;transition:opacity .2s;
  border-left:2px solid var(--rosa)}
nav a:hover span{opacity:1}
@media(max-width:1080px){nav{display:none}}

/* seções */
section{padding:74px 0;border-top:1px solid var(--borda)}
section:first-of-type{border-top:none}
.num{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;letter-spacing:.28em;
  color:var(--rosa);display:block;margin-bottom:12px;font-weight:600}
h2{font-size:clamp(26px,3.6vw,40px);line-height:1.14;letter-spacing:-.02em;font-weight:800;
  margin-bottom:12px}
h2 em{font-style:normal;color:var(--rosa)}
.sub{font-size:16px;color:var(--txt3);margin-bottom:30px;max-width:76ch;line-height:1.65}
p{font-size:17.5px;line-height:1.85;color:var(--txt2);margin-bottom:16px;max-width:88ch}
p b,li b{color:#fff;font-weight:650}
p em{font-style:normal;color:var(--ouro)}
.rv{opacity:0;transform:translateY(20px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.8,.2,1)}
.rv.on{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}}

/* capa */
#capa{min-height:100vh;display:grid;grid-template-columns:minmax(300px,440px) 1fr;
  gap:50px;align-items:center;padding:60px 0;border:none}
.esf{position:relative;aspect-ratio:1;width:100%;max-width:440px}
.esf canvas{width:100%;height:100%;display:block}
.esf-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;pointer-events:none}
.esf-c::before{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:66%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,rgba(8,13,22,.9) 40%,rgba(8,13,22,0) 74%)}
.esf-n{position:relative;font-family:ui-monospace,Menlo,monospace;font-size:clamp(56px,9vw,92px);
  font-weight:800;line-height:1;color:var(--rosa)}
.esf-l{position:relative;font-size:11px;letter-spacing:.3em;color:var(--ouro);font-weight:700;margin-top:12px}
.esf-s{position:relative;font-size:13.5px;color:var(--txt2);margin-top:8px;max-width:24ch}
.eyebrow{font-size:12px;letter-spacing:.32em;color:var(--verm);font-weight:700;margin-bottom:18px}
h1{font-size:clamp(34px,5.4vw,62px);line-height:1.08;letter-spacing:-.03em;font-weight:800;color:#fff}
h1 em{font-style:normal;color:var(--rosa)}
.lead{font-size:19px;line-height:1.75;color:var(--txt2);margin-top:22px;max-width:60ch}
.assina{margin-top:30px;font-size:13px;color:var(--txt3);letter-spacing:.06em}
@media(max-width:900px){#capa{grid-template-columns:1fr;min-height:auto;gap:26px}.esf{max-width:300px;margin:0 auto}}

/* números */
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:3px;margin:26px 0}
.n{padding:22px 24px;background:var(--sup);border-left:3px solid var(--rosa)}
.n.ok{border-left-color:var(--verde)} .n.mau{border-left-color:var(--verm);background:rgba(120,20,20,.24)}
.n-v{font-family:ui-monospace,Menlo,monospace;font-size:38px;font-weight:800;line-height:1;color:#fff}
.n.ok .n-v{color:var(--verde)} .n.mau .n-v{color:#FF9B9B}
.n-t{font-size:11.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--txt3);margin-top:10px;font-weight:600}
.n-s{font-size:13.5px;color:var(--txt3);margin-top:6px;line-height:1.55}

/* golpe */
.golpe{margin:26px 0;padding:26px 30px;border-left:5px solid var(--verm);
  background:linear-gradient(90deg,rgba(255,77,77,.14),rgba(255,61,139,.04));
  font-size:21px;line-height:1.55;font-weight:700;color:#fff}
.golpe.v{border-left-color:var(--verde);background:linear-gradient(90deg,rgba(43,232,165,.13),rgba(43,232,165,.02))}
.golpe.o{border-left-color:var(--ouro);background:linear-gradient(90deg,rgba(255,200,97,.13),rgba(255,200,97,.02))}
.golpe small{display:block;font-size:16px;font-weight:400;color:var(--txt2);margin-top:12px;line-height:1.75}

/* cartões de erro */
.erros{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:3px}
.erro{padding:26px 28px;background:rgba(120,20,20,.22);border-left:4px solid var(--verm);position:relative}
.erro-n{position:absolute;right:20px;top:16px;font-family:ui-monospace,Menlo,monospace;font-size:44px;
  font-weight:800;color:rgba(255,77,77,.18);line-height:1}
.erro h3{font-size:19px;color:#FFB0B0;margin-bottom:14px;padding-right:52px;line-height:1.3;font-weight:700}
.rot{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--txt3);
  margin:16px 0 5px;font-weight:700}
.erro p{font-size:16px;line-height:1.78;margin:0}
.prova{font-family:ui-monospace,Menlo,monospace;font-size:15px;color:var(--ouro)}
.fazer{color:#9DF5CE}

/* verbetes */
details{background:var(--sup);border-left:3px solid rgba(255,255,255,.14);margin-bottom:3px}
details[open]{border-left-color:var(--ouro)}
summary{cursor:pointer;padding:18px 22px;font-size:17px;color:var(--txt);list-style:none;
  display:flex;gap:14px;align-items:baseline;transition:background .15s}
summary::-webkit-details-marker{display:none}
summary:hover{background:var(--sup2)}
details[open] summary{color:var(--ouro);font-weight:650}
.tag{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--txt3);flex-shrink:0;min-width:78px}
.corpo{padding:0 22px 22px 22px}
.corpo p{font-size:16.5px}
.aplic{border-left:3px solid var(--rosa);background:rgba(255,61,139,.08);padding:14px 18px;margin-top:12px}
.aplic p{margin:0;color:var(--txt2)} .aplic b{color:#FFB9D2}

/* tabela */
table{width:100%;border-collapse:collapse;font-size:16px;margin-top:16px}
th{text-align:left;padding:14px 15px;font-size:11.5px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--txt3);background:var(--sup2);font-weight:700}
td{padding:14px 15px;border-bottom:1px solid var(--borda);color:var(--txt2);vertical-align:top;line-height:1.6}
td:first-child{color:#fff;font-weight:650}
.dir{color:#FF9B9B;font-family:ui-monospace,Menlo,monospace;font-size:14px}
.ven{color:#9DF5CE;font-family:ui-monospace,Menlo,monospace;font-size:14px}

/* gráficos svg */
.grafs{display:grid;grid-template-columns:repeat(auto-fit,minmax(400px,1fr));gap:3px;margin-top:22px}
.graf{background:var(--sup);padding:24px 26px}
.graf h4{font-size:16px;color:#fff;font-weight:700;margin-bottom:4px}
.graf .gs{font-size:13.5px;color:var(--txt3);margin-bottom:18px;line-height:1.5}
.graf svg{width:100%;height:auto;display:block;overflow:visible}
.lg{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;font-size:13px;color:var(--txt2)}
.lg i{display:inline-block;width:12px;height:12px;margin-right:6px;vertical-align:-1px}

/* blocos diversos */
.assum{display:flex;gap:18px;padding:20px 22px;margin-bottom:3px;background:rgba(120,20,20,.22);
  border-left:3px solid var(--verm)}
.assum-n{font-family:ui-monospace,Menlo,monospace;font-size:22px;font-weight:800;
  color:rgba(255,77,77,.5);min-width:30px;line-height:1.3}
.assum h4{font-size:17.5px;color:#FFB0B0;margin-bottom:7px;line-height:1.3}
.assum p{font-size:16px;margin:0}
.tri{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:3px;margin:20px 0}
.tri>div{padding:22px 24px;background:var(--sup);border-top:3px solid var(--ouro)}
.tri h4{font-size:16px;color:var(--ouro);margin-bottom:10px}
.tri p{font-size:16px;margin:0}
.decl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ouro);
  border:1px solid rgba(255,200,97,.45);padding:2px 8px;margin-left:7px;white-space:nowrap}
.perg{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:3px;margin-top:20px}
.perg>div{padding:30px 26px;background:var(--sup2);text-align:center}
.perg .q{font-size:21px;color:#fff;font-weight:750;margin-bottom:14px;line-height:1.3}
.perg .a{font-size:16px;color:var(--txt2);line-height:1.75}
ul,ol{margin:0 0 16px 22px} li{font-size:17px;line-height:1.8;color:var(--txt2);margin-bottom:9px}

footer{padding:60px 0 80px;border-top:1px solid var(--borda);color:var(--txt3);font-size:14px}
@media print{
  nav,#prog{display:none} body{background:#fff;color:#000}
  section{page-break-inside:avoid;border-color:#ccc} .rv{opacity:1;transform:none}
}
@media(max-width:640px){
  body{font-size:16px} .wrap{padding:0 16px} section{padding:48px 0}
  .erros,.grafs{grid-template-columns:1fr} .n-v{font-size:32px} .golpe{font-size:18px;padding:20px 22px}
}
</style>
</head>
<body>
<div id="prog"></div>
<nav id="nav"></nav>
<div class="wrap" id="doc"></div>

<script>
/* ═══════════════════════════════════════════════════════════════════
   DADOS — é só aqui que se mexe para atualizar o documento
   ═══════════════════════════════════════════════════════════════════ */
var D = {
  /* ── do aplicativo (aba Comparativo / Dash de Cotações) ── */
  excMedio      : 52.9,   // % médio acima da faixa do nicho B/C
  indice        : 46,     // índice de contracorrente (0 a 100)
  cotacoes      : 60,     // cotações no período
  vendas        : 11,     // reservas fechadas no período
  pctIdeal      : 41.7,   // % da carteira que é cliente ideal
  convIdeal     : 8.0,    // % de conversão do perfil ideal
  convComplexo  : 2.9,    // % de conversão do perfil complexo
  frotaTotal    : 22,     // carros na frota
  frotaMinivan  : 16,     // quantos são minivan (7L + 8L)
  diasMeta      : 11,     // dias até bater o Diamante
  diasCiclo     : 31,     // dias do ciclo
  cvVendas      : 48,     // coeficiente de variação das vendas por dia (%)

  /* ── preços: MAGIWAY_Analise_Precos_NEON, agosto/2026, nicho B/C sem GS ── */
  precos: [
    {nome:'Minivan',     mag:1864, nicho:1251, topo:1500, sug:1549},
    {nome:'SUV',         mag:1642, nicho: 995, topo:1200, sug:1290},
    {nome:'SUV Premium', mag:4527, nicho:null, topo:null, sug:2690}
  ],

  /* ── declarados: não saem de nenhuma tela ── */
  papeis    : 8,    // frentes que a mesma pessoa toca
  tempoVenda: 35,   // % do tempo efetivamente vendendo
  sublocado : 40,   // % da frota que é sublocada
  qi        : 141
};

/* ═══════════════════════════════════════════════════════════════════
   FERRAMENTAS DE DESENHO
   Gráfico aqui é SVG escrito à mão. Sem biblioteca: o documento precisa
   abrir sem internet, num notebook emprestado, cinco minutos antes da
   reunião. Biblioteca por CDN quebra exatamente nessa hora.
   ═══════════════════════════════════════════════════════════════════ */
var n0=function(v){ return Math.round(+v||0).toLocaleString('pt-BR'); };
var n1=function(v){ return (+v||0).toFixed(1).replace('.',','); };
var esc=function(v){ return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;'); };

/* barras agrupadas, horizontais — legíveis em projeção */
function barras(series, rotulos, cores, sufixo, largura){
  var L=largura||560, alt=rotulos.length*(series.length*22+22)+14, x0=142;
  var max=0; series.forEach(function(s){ s.dados.forEach(function(v){ if(v>max) max=v; }); });
  max=max||1;
  var o='<svg viewBox="0 0 '+L+' '+alt+'" role="img">';
  /* linhas de referência */
  for(var g=0;g<=4;g++){
    var gx=x0+(L-x0-16)*g/4;
    o+='<line x1="'+gx+'" y1="0" x2="'+gx+'" y2="'+(alt-14)+'" stroke="rgba(255,255,255,.07)"/>';
  }
  var y=6;
  rotulos.forEach(function(rot,i){
    o+='<text x="'+(x0-12)+'" y="'+(y+series.length*11+3)+'" text-anchor="end" fill="#C3D5E6" '
      +'font-size="13.5" font-family="inherit">'+esc(rot)+'</text>';
    series.forEach(function(s,j){
      var v=+s.dados[i]||0, w=Math.max(v>0?4:0,(L-x0-16)*(v/max));
      o+='<rect x="'+x0+'" y="'+y+'" width="'+w.toFixed(1)+'" height="17" fill="'+cores[j]+'" opacity=".92">'
        +'<animate attributeName="width" from="0" to="'+w.toFixed(1)+'" dur="0.9s" fill="freeze"/></rect>';
      if(v>0) o+='<text x="'+(x0+w+8)+'" y="'+(y+13)+'" fill="#EAF2FA" font-size="12.5" '
        +'font-family="ui-monospace,Menlo,monospace">'+n0(v)+(sufixo||'')+'</text>';
      y+=22;
    });
    y+=22;
  });
  return o+'</svg>';
}
function legenda(nomes,cores){
  return '<div class="lg">'+nomes.map(function(n,i){
    return '<span><i style="background:'+cores[i]+'"></i>'+esc(n)+'</span>'; }).join('')+'</div>';
}
/* funil de estreitamento — usado no bloco da improbabilidade */
function funil(etapas){
  var L=620, h=etapas.length*54+10, x0=0;
  var o='<svg viewBox="0 0 '+L+' '+h+'" role="img">';
  etapas.forEach(function(e,i){
    var w=Math.max(26,L*e.frac), y=i*54;
    o+='<rect x="'+((L-w)/2)+'" y="'+y+'" width="'+w+'" height="34" fill="'+(e.cor||'#FF3D8B')+'" opacity=".85">'
      +'<animate attributeName="width" from="0" to="'+w+'" dur="0.8s" begin="'+(i*0.09)+'s" fill="freeze"/>'
      +'<animate attributeName="x" from="'+(L/2)+'" to="'+((L-w)/2)+'" dur="0.8s" begin="'+(i*0.09)+'s" fill="freeze"/></rect>';
    o+='<text x="'+(L/2)+'" y="'+(y+23)+'" text-anchor="middle" fill="#08101C" font-size="13.5" '
      +'font-weight="700" font-family="inherit">'+esc(e.t)+'</text>';
    o+='<text x="'+(L/2)+'" y="'+(y+48)+'" text-anchor="middle" fill="#8FA6BC" font-size="12.5" '
      +'font-family="inherit">'+esc(e.s)+'</text>';
  });
  return o+'</svg>';
}
/* curva de duas linhas — ritmo até a meta */
function curva(real, alvo, L, H){
  L=L||560; H=H||220;
  var max=Math.max.apply(null,real.concat(alvo))||1, n=real.length;
  var px=function(i){ return 34+(L-50)*(n>1?i/(n-1):0); };
  var py=function(v){ return H-26-(H-46)*(v/max); };
  var cam=function(arr){ return arr.map(function(v,i){ return (i?'L':'M')+px(i).toFixed(1)+' '+py(v).toFixed(1); }).join(' '); };
  var o='<svg viewBox="0 0 '+L+' '+H+'" role="img">';
  for(var g=0;g<=3;g++){ var gy=H-26-(H-46)*g/3;
    o+='<line x1="30" y1="'+gy+'" x2="'+(L-14)+'" y2="'+gy+'" stroke="rgba(255,255,255,.07)"/>'; }
  o+='<path d="'+cam(alvo)+'" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1.6" stroke-dasharray="6 5"/>';
  o+='<path d="'+cam(real)+' L'+px(n-1).toFixed(1)+' '+(H-26)+' L34 '+(H-26)+' Z" fill="rgba(43,232,165,.13)"/>';
  o+='<path d="'+cam(real)+'" fill="none" stroke="#2BE8A5" stroke-width="2.8">'
    +'<animate attributeName="stroke-dasharray" from="0 3000" to="3000 0" dur="1.5s" fill="freeze"/></path>';
  return o+'</svg>';
}
</script>
<script>
/* ═══════════════════════════════════════════════════════════════════
   A ESFERA — a mesma linguagem visual do aplicativo
   Pontos distribuídos por espiral de Fibonacci, respiração radial,
   impulsos que atravessam a malha e giro lento. O número no meio é a
   dificuldade de vender, com as funções acumuladas entrando na conta.
   ═══════════════════════════════════════════════════════════════════ */
function esferaIniciar(cv, nivel, cor){
  var P=[], N=150, ang=0;
  var ph=Math.PI*(3-Math.sqrt(5));
  for(var i=0;i<N;i++){
    var y=1-(i/(N-1))*2, r=Math.sqrt(Math.max(0,1-y*y)), t=ph*i;
    P.push({ lat:Math.asin(y), lon:t, fase:Math.random()*6.2832,
      vel:.011+Math.random()*.016, amp:.10+Math.random()*.13, carga:0, rad:1,
      x:r*Math.cos(t), y:y, z:r*Math.sin(t) });
  }
  var viz=null, quadro=0;
  var vizinhos=function(){
    viz=P.map(function(){ return []; });
    for(var a=0;a<P.length;a++) for(var b=a+1;b<P.length;b++){
      var dx=P[a].x-P[b].x, dy=P[a].y-P[b].y, dz=P[a].z-P[b].z;
      if(dx*dx+dy*dy+dz*dz<0.25){ viz[a].push(b); viz[b].push(a); }
    }
    quadro=0;
  };
  vizinhos();
  var ctx=cv.getContext('2d'), ultimo=0;
  var mover=function(){
    if(++quadro>90) vizinhos();
    if(Math.random()<0.03+0.05*(nivel/100)) P[(Math.random()*P.length)|0].carga=1;
    var novo=P.map(function(p,i){
      var c=p.carga*0.90;
      viz[i].forEach(function(k){ var q=P[k].carga*0.11; if(q>c) c=q; });
      return c<0.004?0:c;
    });
    P.forEach(function(p,i){
      p.carga=novo[i]; p.fase+=p.vel;
      p.rad=1+p.amp*Math.sin(p.fase)+0.26*p.carga;
      var cl=Math.cos(p.lat);
      p.x=cl*Math.cos(p.lon); p.y=Math.sin(p.lat); p.z=cl*Math.sin(p.lon);
    });
  };
  var desenhar=function(){
    var dpr=Math.min(2,window.devicePixelRatio||1);
    var L=cv.clientWidth||360, H=cv.clientHeight||360;
    if(cv.width!==L*dpr){ cv.width=L*dpr; cv.height=H*dpr; }
    ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,L,H);
    var cx=L/2, cy=H/2, R=Math.min(L,H)*0.37, FOC=2.6;
    var ci=Math.cos(-0.30), si=Math.sin(-0.30), ca=Math.cos(ang), sa=Math.sin(ang);
    var pr=P.map(function(p){
      var px=p.x*p.rad, py=p.y*p.rad, pz=p.z*p.rad;
      var x=px*ca-pz*sa, z0=px*sa+pz*ca;
      var y=py*ci-z0*si, z=py*si+z0*ci, e=FOC/(FOC-z);
      return {sx:cx+x*R*e, sy:cy+y*R*e, z:z, c:p.carga};
    });
    for(var a=0;a<P.length;a++) for(var b=a+1;b<P.length;b++){
      var dx=P[a].x-P[b].x, dy=P[a].y-P[b].y, dz=P[a].z-P[b].z;
      var d=Math.sqrt(dx*dx+dy*dy+dz*dz);
      if(d>0.46) continue;
      var A=pr[a], B=pr[b], f=((A.z+B.z)/2+1)/2;
      var op=(0.10+0.42*f)*(1-d/0.46), c=Math.max(P[a].carga,P[b].carga);
      if(c>0.03){ ctx.lineWidth=1+2.4*c; ctx.strokeStyle='rgba(120,200,255,'+Math.min(1,.34+.66*c).toFixed(3)+')'; }
      else{ ctx.lineWidth=.85; ctx.strokeStyle='rgba(255,61,139,'+op.toFixed(3)+')'; }
      ctx.beginPath(); ctx.moveTo(A.sx,A.sy); ctx.lineTo(B.sx,B.sy); ctx.stroke();
    }
    pr.slice().sort(function(x,y){ return x.z-y.z; }).forEach(function(Q){
      var f=(Q.z+1)/2, r=(1+2.2*f)*(1+1.3*Q.c);
      ctx.beginPath(); ctx.arc(Q.sx,Q.sy,r,0,6.2832);
      ctx.fillStyle=Q.c>0.03?'rgba(190,230,255,'+Math.min(1,.5+.5*Q.c).toFixed(3)+')'
        :'rgba(255,'+Math.round(110+95*f)+','+Math.round(155+75*f)+','+(0.36+0.6*f).toFixed(3)+')';
      ctx.shadowColor=Q.c>0.03?'#78C8FF':cor; ctx.shadowBlur=Q.c>0.03?13:(f>.86?11:0);
      ctx.fill(); ctx.shadowBlur=0;
    });
  };
  (function laco(t){
    requestAnimationFrame(laco);
    if(t-ultimo<16) return;
    ultimo=t; ang+=0.0011; mover(); desenhar();
  })(0);
}
</script>

/* esfera: o nível soma os oito fatores do app mais as funções acumuladas */
(function(){
  var foraVenda=100-D.tempoVenda;
  var funcoes=Math.min(100,(Math.min(D.papeis,10)/10*60)+(foraVenda/100*40));
  var nivel=Math.round(D.indice*0.88 + funcoes*0.12);
  var cor = nivel>=70?'#FF4D4D' : (nivel>=45?'#FF3D8B' : '#FFC861');
  var el=document.getElementById('esf-n');
  if(el) el.style.color=cor;
  var cv=document.getElementById('esf');
  if(cv) esferaIniciar(cv, nivel, cor);
  var t0=performance.now();
  (function tick(now){
    var q=Math.min(1,(now-t0)/1400), e=1-Math.pow(1-q,3);
    if(el) el.textContent=Math.round(nivel*e);
    if(q<1) requestAnimationFrame(tick);
  })(t0);
})();

/* revelar ao rolar + barra de progresso + item de navegação ativo */
(function(){
  var blocos=[].slice.call(document.querySelectorAll('.rv'));
  if('IntersectionObserver' in window){
    var io=new IntersectionObserver(function(is){
      is.forEach(function(i){ if(i.isIntersecting){ i.target.classList.add('on'); io.unobserve(i.target); } });
    },{threshold:.12});
    blocos.forEach(function(b){ io.observe(b); });
  } else blocos.forEach(function(b){ b.classList.add('on'); });

  var prog=document.getElementById('prog');
  var links=[].slice.call(document.querySelectorAll('#nav a'));
  var secs=S.map(function(x){ return document.getElementById(x.id); });
  var aoRolar=function(){
    var h=document.documentElement;
    var p=h.scrollTop/((h.scrollHeight-h.clientHeight)||1);
    prog.style.width=(p*100).toFixed(1)+'%';
    var meio=h.scrollTop+h.clientHeight*0.35, atual=0;
    secs.forEach(function(sc,i){ if(sc && sc.offsetTop<=meio) atual=i; });
    links.forEach(function(a,i){ a.classList.toggle('on', i===atual); });
  };
  window.addEventListener('scroll',aoRolar,{passive:true});
  window.addEventListener('resize',aoRolar);
  aoRolar();
})();
